          <li><strong>Eisenhower Matrix:</strong> Prioritize high-impact work across Urgent, Plan, Delegate, and Later categories.</li>
          <li><strong>Pomodoro Focus Timer:</strong> Stay productive with integrated work and break sessions.</li>
