<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="kl-fav-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#68625d"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#262423"/>
    </linearGradient>
  </defs>
  <!-- Square container -->
  <rect width="32" height="32" fill="url(#kl-fav-grad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Column 1: Vertical spine of the K (2 cards) -->
  <rect x="5" y="5" width="6" height="9.5" rx="1.8" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="5" y="16.5" width="6" height="10.5" rx="1.8" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Column 2: Ghost card slots + bright center K node -->
  <rect x="13" y="5" width="6" height="4.5" rx="1.8" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="13" y="11.5" width="6" height="9" rx="1.8" fill="#ffffff" fill-opacity="1"/>
  <rect x="13" y="22.5" width="6" height="4.5" rx="1.8" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Column 3: K upper arm, ghost slot, K lower leg -->
  <rect x="21" y="5" width="6" height="8.5" rx="1.8" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="21" y="15.5" width="6" height="3.5" rx="1.8" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="21" y="21" width="6" height="6" rx="1.8" fill="#ffffff" fill-opacity="0.9"/>
</svg>